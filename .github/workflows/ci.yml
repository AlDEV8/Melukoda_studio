name: CI
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy -p studio-core --all-targets -- -D warnings
      - run: cargo test -p studio-core
  ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/studio-desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/studio-desktop/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm run build
